name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow
      - name: Generate icon
        run: python scripts/make_icon.py
      - name: Build app
        run: |
          python -m PyInstaller --clean --noconfirm --windowed `
            --name "Polecenie przelewu" `
            --icon "assets/icon.ico" `
            --add-data "assets/template.pdf;assets" `
            --add-data "assets/icon.ico;assets" `
            --add-data "assets/fonts;assets/fonts" main.py
      - name: Create ZIP
        run: |
          Compress-Archive -Path "dist/Polecenie przelewu/*" -DestinationPath "dist/Polecenie-przelewu-windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polecenie-przelewu-windows
          path: dist/Polecenie-przelewu-windows.zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Polecenie-przelewu-windows.zip