name: Build macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-macos-lock.txt
      - name: Build app
        run: |
          python -m PyInstaller --clean --noconfirm --windowed \
            --target-architecture arm64 --name "Polecenie przelewu" \
            --osx-bundle-identifier pl.polecenieprzelewu.desktop \
            --icon "assets/icon.icns" \
            --add-data "assets/template.pdf:assets" \
            --add-data "assets/icon.icns:assets" main.py
      - name: Create DMG
        run: |
          hdiutil create -volname "Polecenie przelewu" \
            -srcfolder "dist/Polecenie przelewu.app" \
            -ov -format UDZO "dist/Polecenie-przelewu.dmg"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polecenie-przelewu-macos
          path: dist/Polecenie-przelewu.dmg
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Polecenie-przelewu.dmg
          body: |
            Aplikacja **nie jest podpisana** certyfikatem Apple Developer (unsigned).
            Na macOS Gatekeeper może zablokować pierwsze uruchomienie — zezwól w
            Ustawienia systemowe → Prywatność i bezpieczeństwo, albo uruchom:
            `xattr -dr com.apple.quarantine "Polecenie przelewu.app"`